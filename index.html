<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Number Generator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-lg">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">
            Random Number Generator
        </h1>
        <!-- Minimum Number -->
        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2">
                Minimum Number
            </label>
            <input type="number" id="minNumber"  placeholder="Enter minimum number" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500" >
        </div>
        <!-- Maximum Number -->
        <div class="mb-6">
            <label class="block text-gray-700 font-semibold mb-2">
                Maximum Number
            </label>
            <input type="number"  id="maxNumber" placeholder="Enter maximum number"  class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <!-- Generate Button -->
        <button onclick="generateNumber()"  class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
            Generate Random Number
        </button>
        <!-- Result -->
        <div class="mt-6 text-center">
            <p class="text-gray-600 font-medium">
                Random Number
            </p>
            <p  id="result" class="text-4xl font-bold text-blue-600 mt-3">
                -
            </p>
            <p id="error" class="text-red-500 mt-3"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
